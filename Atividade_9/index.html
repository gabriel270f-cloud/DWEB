<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 9 - Funções JavaScript</title>
    <script src="atividade8.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
            background-color: #f4f4f9;
        }
        .container {
            border: 2px solid #333;
            padding: 20px;
            border-radius: 8px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 350px;
        }
        button {
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        h2 {
            text-align: center;
            color: #333;
        }
    </style>
</head>
<body>

    <h2>Atividade 9 - Funções JS</h2>
    
    <div class="container">
        <button onclick="funcao1()">Executar Função 1 (Maior Número)</button>
        <button onclick="funcao2()">Executar Função 2 (Ordem Crescente)</button>
        <button onclick="funcao3()">Executar Função 3 (Palíndromo)</button>
        <button onclick="funcao4()">Executar Função 4 (Subconjunto)</button>
        <button onclick="funcao5()">Executar Função 5 (Dia da Semana)</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
